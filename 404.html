<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ali Rifat</title><meta name="robots" content="noindex">
<script>
  // An address under one of the site's folders: hand it to that app as ?path=, which puts it back.
  (function () {
    var m = location.pathname.match(/^(\/cv-vorschau\/[^\/]+\/)(.*)$/);
    if (m) location.replace(m[1] + '?path=' + encodeURIComponent(m[2]) + location.search.replace(/^\?/, '&') + location.hash);
    else location.replace('/cv-vorschau/');
  })();
</script>
<style>body{font-family:Georgia,serif;background:#f4f1ea;color:#1b1a17;margin:0;min-height:100vh;display:grid;place-items:center}</style>
</head><body><p>One moment.</p></body></html>
